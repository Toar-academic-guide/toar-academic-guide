name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & security
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      - name: Security audit (high + critical)
        run: npm audit --audit-level=high
      - name: Drizzle migration consistency
        run: npm run db:migrate:check

  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI: true
      CATALOGUE_SOURCE_MODE: static
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Validate catalogue seed (dry-run)
        run: npm run db:seed:dry-run

  pre-pr-guard:
    name: Pre-PR guard
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI: true
      BASE_REF: origin/main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch comparison base
        run: git fetch origin main --depth=1
      - name: Run project pre-PR guard
        run: npm run guard:pre-pr

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs:
      - test
      - pre-pr-guard
    env:
      CI: true
      CATALOGUE_SOURCE_MODE: static
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
