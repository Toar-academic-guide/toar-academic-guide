name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job 1: Static analysis — lint, type check, format, security audit
# ---------------------------------------------------------------------------
jobs:
  quality:
    name: Lint, typecheck & security
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Security audit (high + critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Drizzle migration consistency
        run: npm run db:migrate:check
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Job 2: Unit tests with coverage
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI: true
      CATALOGUE_SOURCE_MODE: static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Validate catalogue seed (dry-run)
        run: npm run db:seed:dry-run

  # ---------------------------------------------------------------------------
  # Job 3: Build
  # ---------------------------------------------------------------------------
  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: test
    env:
      CI: true
      CATALOGUE_SOURCE_MODE: static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 4: E2E smoke tests (on main push or manual dispatch)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    env:
      CI: true
      CATALOGUE_SOURCE_MODE: static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 30000
          npm run test:e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 5: DB-backed catalogue verification (main + manual only)
  # ---------------------------------------------------------------------------
  db-seed-verify:
    name: DB-backed catalogue verification
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    env:
      CI: true
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CATALOGUE_SOURCE_MODE: database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Skip DB verification when DATABASE_URL is missing
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL secret is not configured; skipping DB-backed seed verification."

      - name: Install dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: npm ci

      - name: Verify seeded database catalogue
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run db:seed:verify
