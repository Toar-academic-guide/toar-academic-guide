name: Playwright on Vercel Preview

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: playwright-preview-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  playwright-preview:
    name: Playwright against Vercel Preview
    runs-on: ubuntu-latest
    environment: preview-e2e
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview – toar-academic-guide' &&
      github.event.deployment_status.target_url != '' &&
      contains(github.event.deployment_status.target_url, 'toar-academic-guide') &&
      contains(github.event.deployment_status.target_url, '.vercel.app')
    env:
      CI: true
      BASE_URL: ${{ github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against Vercel Preview
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-vercel-preview-failures
          path: test-results/
          retention-days: 7
