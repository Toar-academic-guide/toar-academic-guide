name: Process Reviewed Admission Alerts

on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_id:
        description: Published canonical release UUID (leave empty to recover missed work)
        required: false
        type: string
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: admission-alert-release-${{ inputs.release_id || 'maintenance' }}
  cancel-in-progress: false

jobs:
  process:
    # Explicit opt-in after the protected credential is provisioned; no sender runs here.
    if: ${{ vars.ADMISSION_ALERT_PROCESSING_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: admissions-publication
    timeout-minutes: 45
    concurrency:
      group: admission-alert-official-source-budget
      cancel-in-progress: false
    env:
      CI: true
      ADMISSION_ALERT_DATABASE_URL: ${{ secrets.ADMISSION_ALERT_DATABASE_URL }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Process bounded reviewed-release work
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$RELEASE_ID" ]; then args+=(--release-id "$RELEASE_ID"); fi
          node scripts/process-admission-alerts.mjs "${args[@]}"
