name: Resolve Admissions Reviews

on:
  workflow_dispatch:
    inputs:
      action:
        description: Review resolution action
        type: choice
        options: [approve, reject]
        required: true
      ids:
        description: Comma-separated review item UUIDs
        type: string
        required: true
      actor:
        description: Operator resolving the reviews
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: admissions-review-resolve
  cancel-in-progress: false

jobs:
  resolve-reviews:
    runs-on: ubuntu-latest
    environment: admissions-publication
    env:
      ACTION: ${{ inputs.action }}
      IDS: ${{ inputs.ids }}
      ACTOR: ${{ inputs.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate review resolution inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          case "$ACTION" in
            approve|reject) ;;
            *) echo 'Action must be approve or reject.' >&2; exit 1 ;;
          esac

          ACTOR="${ACTOR#"${ACTOR%%[![:space:]]*}"}"
          ACTOR="${ACTOR%"${ACTOR##*[![:space:]]}"}"
          [[ -n "$ACTOR" ]] || { echo 'Actor must be non-empty after trimming.' >&2; exit 1; }
          case "$ACTOR" in
            jorje|amit) ;;
            *) echo 'Actor must be exactly jorje or amit after trimming (case-sensitive).' >&2; exit 1 ;;
          esac
          [[ -n "$TRIGGERING_ACTOR" ]] || { echo 'Triggering actor must be non-empty.' >&2; exit 1; }

          uuid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          ids=()
          remaining="$IDS"
          while :; do
            id="${remaining%%,*}"
            id="${id#"${id%%[![:space:]]*}"}"
            id="${id%"${id##*[![:space:]]}"}"
            [[ "$id" =~ $uuid_pattern ]] || { echo 'IDs must be a non-empty comma-separated list of UUIDs, with no empty entries.' >&2; exit 1; }
            ids+=("$id")
            [[ "$remaining" == *,* ]] || break
            remaining="${remaining#*,}"
          done

          mkdir -p scratch/admissions-review-resolve
          printf '%s\n' "${ids[@]}" > scratch/admissions-review-resolve/ids.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve reviews sequentially
        id: resolve
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mapfile -t ids < scratch/admissions-review-resolve/ids.txt
          [[ "${#ids[@]}" -gt 0 ]] || { echo 'No review IDs to resolve.' >&2; exit 1; }
          audit_file=scratch/admissions-review-resolve/audit.jsonl
          : > "$audit_file"
          # FD 3 keeps stdout separate; pipefail propagates CLI failures through tee.
          for id in "${ids[@]}"; do
            case "$ACTION" in
              approve)
                npm run admissions:approve-review -- "$id" --actor "$ACTOR" < /dev/null --triggering-actor "$TRIGGERING_ACTOR" 2>&1 1>&3 | tee -a "$audit_file" >&2
                ;;
              reject)
                npm run admissions:reject-review -- "$id" --actor "$ACTOR" < /dev/null --triggering-actor "$TRIGGERING_ACTOR" 2>&1 1>&3 | tee -a "$audit_file" >&2
                ;;
            esac
          done 3>&1

      - name: Upload review resolution audit
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admissions-review-resolve-audit
          path: scratch/admissions-review-resolve/audit.jsonl
          if-no-files-found: warn
