name: Publish Reviewed Admissions Release

on:
  push:
    branches:
      - main
    paths:
      - src/data/admissions/reviewedManifest.json
  workflow_dispatch:
    inputs:
      repository_commit:
        description: Optional already-merged main commit to publish
        required: false
        type: string
      proof_failure_stage:
        description: Operational-proof-only controlled failure stage
        required: false
        type: string
      proof_confirmation_id:
        description: Required matching operational proof scenario for fault injection
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: admissions-publication
  cancel-in-progress: false

jobs:
  release_intent:
    name: release-intent
    runs-on: ubuntu-latest
    outputs:
      repository_commit: ${{ steps.intent.outputs.repository_commit }}
      release_kind: ${{ steps.intent.outputs.release_kind }}
    env:
      REQUESTED_COMMIT: ${{ inputs.repository_commit || github.sha }}
    steps:
      - name: Checkout requested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REQUESTED_COMMIT }}
          fetch-depth: 0

      - name: Classify the reviewed manifest
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          release_kind="$(jq -r '.releaseKind // empty' src/data/admissions/reviewedManifest.json)"
          case "$release_kind" in
            canonical_bootstrap|canonical_change|operational_proof) ;;
            *) echo 'Reviewed manifest must declare a supported release kind.'; exit 1 ;;
          esac
          echo "repository_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_kind=$release_kind" >> "$GITHUB_OUTPUT"

  publish-reviewed-release:
    name: Publish reviewed admissions release
    needs: release_intent
    if: ${{ github.event_name == 'workflow_dispatch' || needs.release_intent.outputs.release_kind != 'operational_proof' }}
    runs-on: ubuntu-latest
    environment: admissions-publication
    env:
      CI: true
      OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLISHED_COMMIT: ${{ needs.release_intent.outputs.repository_commit }}

    steps:
      - name: Checkout current publication runner
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify commit is merged into main
        shell: bash
        run: git merge-base --is-ancestor "$PUBLISHED_COMMIT" origin/main

      - name: Materialize reviewed manifest from original commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch/admissions-publication
          git show "$PUBLISHED_COMMIT:src/data/admissions/reviewedManifest.json" > scratch/admissions-publication/reviewedManifest.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database migrations
        run: npm run db:migrate:check

      - name: Verify production operational schema
        run: npm run db:operational:publication

      - name: Verify publisher database identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import postgres from 'postgres';

          if (!process.env.DATABASE_URL) {
            throw new Error('DATABASE_URL is unavailable.');
          }
          const sql = postgres(process.env.DATABASE_URL, { max: 1, prepare: false });
          try {
            const [identity] = await sql`
              select
                current_user as database_role,
                has_column_privilege(current_user, 'public.admission_thresholds', 'threshold_value', 'UPDATE') as has_update_column_grant
            `;
            const manifest = JSON.parse(
              await readFile('scratch/admissions-publication/reviewedManifest.json', 'utf8'),
            );
            if (!Array.isArray(manifest.changes)) {
              throw new Error('Reviewed manifest changes are invalid.');
            }
            const targets =
              manifest.releaseKind === 'operational_proof'
                ? []
                : manifest.changes
                    .filter((change) => change?.ruleKind === 'admission_cutoff')
                    .map((change) => {
                      if (
                        typeof change.before !== 'number' ||
                        typeof change.target?.institutionId !== 'string' ||
                        typeof change.target?.programId !== 'string'
                      ) {
                        throw new Error('Reviewed manifest cutoff target is invalid.');
                      }
                      return {
                        institutionId: change.target.institutionId,
                        programId: change.target.programId,
                        before: change.before,
                      };
                    });
            const targetRows = [];
            for (const target of targets) {
              const [result] = await sql`
                select count(*)::int as matching_rows
                from public.admission_thresholds
                where institution_id = ${target.institutionId}
                  and program_id = ${target.programId}
                  and threshold_kind = 'sekhem'
                  and threshold_value = ${target.before}
              `;
              targetRows.push({
                institutionId: target.institutionId,
                programId: target.programId,
                matchingRows: result.matching_rows,
              });
            }
            console.log(
              JSON.stringify({
                publicationDatabaseDiagnostic: { status: 'complete', ...identity, targetRows },
              }),
            );
          } finally {
            await sql.end({ timeout: 5 });
          }
          NODE

      - name: Publish the reviewed manifest atomically
        env:
          PROOF_FAILURE_STAGE: ${{ inputs.proof_failure_stage }}
          PROOF_CONFIRMATION_ID: ${{ inputs.proof_confirmation_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--manifest scratch/admissions-publication/reviewedManifest.json --repository-commit "$PUBLISHED_COMMIT")
          if [ -n "$PROOF_FAILURE_STAGE" ] || [ -n "$PROOF_CONFIRMATION_ID" ]; then
            args+=(--proof-failure-stage "$PROOF_FAILURE_STAGE" --proof-confirmation-id "$PROOF_CONFIRMATION_ID")
          fi
          npm run admissions:publish -- "${args[@]}"
